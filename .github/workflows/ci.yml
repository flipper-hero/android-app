name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :flipper-kit:test :agent-kit-full:test testFullDebugUnitTest testPlayDebugUnitTest assembleFullDebug assemblePlayDebug --no-daemon

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Derive Android version from tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'Expected a tag such as v0.1.0' >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then
            echo 'Minor and patch versions must be below 1000' >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo 'Android version code is out of range' >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Decode release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flipperhero-release.p12"
          chmod 600 "$RUNNER_TEMP/flipperhero-release.p12"
      - name: Build signed release APKs
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/flipperhero-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleFullRelease assemblePlayRelease --no-daemon
      - name: Verify and name APKs
        shell: bash
        run: |
          mkdir dist
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/FlipperHero-${GITHUB_REF_NAME}-full.apk"
          cp app/build/outputs/apk/play/release/app-play-release.apk "dist/FlipperHero-${GITHUB_REF_NAME}-play.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --verify-tag --title "FlipperHero Android $GITHUB_REF_NAME" \
            --notes 'Android preview. Bluetooth and device operations still require testing on an Android phone.' \
            --prerelease
